services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: releaseguard
      POSTGRES_PASSWORD: releaseguard
      POSTGRES_DB: releaseguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://releaseguard:releaseguard@db:5432/releaseguard
      ENVIRONMENT: local
      APP_VERSION: "0.1.0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

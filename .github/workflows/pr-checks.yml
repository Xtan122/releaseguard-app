name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test & Docker Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: releaseguard
          POSTGRES_PASSWORD: releaseguard
          POSTGRES_DB: releaseguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releaseguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (Ruff)
        run: ruff check --ignore B008 .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://releaseguard:releaseguard@localhost:5432/releaseguard
          ENVIRONMENT: test
          APP_VERSION: "0.1.0"
        run: pytest -v

      - name: Validate Docker build
        run: docker build -t releaseguard-app:ci-check .
